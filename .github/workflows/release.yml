name: Build & Release

# ============================================================
# GitHub Actions 自动构建多平台 + 自动发布 Release 模板
#
# 用法:
#   1. 把本文件放到你的项目 .github/workflows/ 目录
#   2. 推送 tag 时自动触发, 例如: git tag v1.0.0 && git push origin v1.0.0
#   3. 自动生成各平台可执行文件并发布 Release
#
# 需要调整的地方(按你的项目改):
#   - 下方 <...> 占位符(入口脚本、项目名、依赖)
#   - 示例: 本模板自带 example.py, 直接打 tag 即可验证全流程
# ============================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: read   # 全局只读; 仅 release job 提升为 write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: release-template-windows-x64.exe
            exe: release-template.exe
          - os: ubuntu-latest
            artifact: release-template-linux-x64
            exe: release-template-linux
          - os: macos-latest
            artifact: release-template-macos-arm64
            exe: release-template-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # 换成你的项目依赖, 例如: python -m pip install requests
          python -m pip install pyinstaller==6.14.0

      - name: Build with PyInstaller (Windows)
        run: |
          python -m PyInstaller --onefile --name "$env:MATRIX_EXE" example.py
        shell: pwsh
        if: runner.os == 'Windows'
        env:
          MATRIX_EXE: ${{ matrix.exe }}

      - name: Build with PyInstaller (Unix)
        run: |
          python -m PyInstaller --onefile --name "${{ matrix.exe }}" example.py
        shell: bash
        if: runner.os != 'Windows'

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 仅此 job 需要写 Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag name
        id: tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.TAG }}
          generate_release_notes: true
          files: |
            artifacts/*
            README.md
